name: Update prices hourly

on:
  schedule:
    - cron: "15 * * * *"   # ทุกชั่วโมง นาทีที่ 15 (UTC)
  workflow_dispatch:        # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest prices
        run: python scripts/update_prices.py

      - name: Commit & push if changed
        run: |
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "update prices $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
